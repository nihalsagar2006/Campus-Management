services:
  - type: web
    name: campus-management-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PROJECT_NAME
        value: Campus Management System
      - key: API_V1_STR
        value: /api/v1
